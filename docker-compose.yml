version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: gmod-manager-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: gmod_manager
      MYSQL_USER: gmod_user
      MYSQL_PASSWORD: gmod_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped

  # Redis 缓存和任务队列
  redis:
    image: redis:7-alpine
    container_name: gmod-manager-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # 后端 API (开发阶段手动启动)
  # api:
  #   build: ./backend
  #   container_name: gmod-manager-api
  #   ports:
  #     - "3000:3000"
  #   env_file:
  #     - ./backend/.env
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #     - ./backend:/app
  #     - /srv:/srv
  #   depends_on:
  #     - mysql
  #     - redis
  #   restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
