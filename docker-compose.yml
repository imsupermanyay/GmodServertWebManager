version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: gmod_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_DATABASE: ${DB_DATABASE:-gmod_manager}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - gmod_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gmod_backend
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3001}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_DATABASE=${DB_DATABASE:-gmod_manager}
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-this}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-24h}
      - SUPER_ADMIN_USERNAME=${SUPER_ADMIN_USERNAME:-admin}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD:-admin123}
    ports:
      - "${PORT:-3001}:3001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backend:/app
      - /app/node_modules
    networks:
      - gmod_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gmod_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - gmod_network

volumes:
  mysql_data:

networks:
  gmod_network:
    driver: bridge
