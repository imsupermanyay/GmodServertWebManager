version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: gmod-manager-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_this_password}
      MYSQL_DATABASE: gmod_manager
      MYSQL_USER: gmod_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_this_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    networks:
      - gmod-network

  # Redis 缓存和任务队列
  redis:
    image: redis:7-alpine
    container_name: gmod-manager-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - gmod-network

  # 后端 API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gmod-manager-backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: gmod_user
      DB_PASSWORD: ${MYSQL_PASSWORD:-change_this_password}
      DB_DATABASE: gmod_manager
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-please_change_this_secret}
      DOCKER_SOCKET_PATH: /var/run/docker.sock
      BARE_REPO_ROOT: /srv/bare
      ALLCODE_ROOT: /srv/allcode
      INSTANCES_ROOT: /srv/instances
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # Docker socket
      - /srv/bare:/srv/bare                        # Git bare repos
      - /srv/allcode:/srv/allcode                  # Git worktrees
      - /srv/instances:/srv/instances              # Instance data
    depends_on:
      - mysql
      - redis
    restart: unless-stopped
    networks:
      - gmod-network

  # 前端 Web
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gmod-manager-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - gmod-network

volumes:
  mysql_data:
  redis_data:

networks:
  gmod-network:
    driver: bridge
